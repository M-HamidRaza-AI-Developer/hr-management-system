{% extends "base.html" %}
{% block title %}{{ "Edit" if department else "New" }} Department{% endblock %}
{% block content %}
<h1>{{ "Edit" if department else "New" }} Department</h1>
<form method="POST" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Name</label><input name="name" value="{{ department.name if department else '' }}" required></div>
  <div class="form-group"><label>Description</label><textarea name="description">{{ department.description if department else '' }}</textarea></div>
  <div class="form-group"><label>Manager</label>
    <select name="manager_id">
      <option value="">-- None --</option>
      {% for e in employees %}
      <option value="{{ e.id }}" {% if department and department.manager_id == e.id %}selected{% endif %}>{{ e.full_name }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
